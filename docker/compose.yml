# omnisense/omnipost with every provider package, your tokens in .env:
#
#   cp .env.dist .env                                          # fill in the tokens at hand
#   docker compose run --rm omnipost providers                 # which providers are installed and configured
#   docker compose run --rm omnipost capabilities instagram    # what the network accepts (no token needed)
#   docker compose run --rm omnipost account instagram
#   docker compose run --rm omnipost feed youtube --limit 5
#   docker compose run --rm omnipost validate instagram https://site.example/reel.mp4 "Caption" --duration 42 --width 1080 --height 1920
#   docker compose run --rm omnipost publish instagram https://site.example/reel.mp4 "Caption" --tag violin
#   docker compose run --rm omnipost status instagram 17890...
#   docker compose run --rm omnipost refresh instagram         # the new token, as JSON
#   docker compose run --rm omnipost bare                      # plain PHP: no bundle, no container, and what PHP loaded
#   docker compose run --rm omnipost bare-share                # plain PHP: every share link of a page, and what PHP loaded
#   docker compose run --rm omnipost test                      # every package's tests
#   docker compose run --rm js                                 # assets/omnipost-share.js on node's test runner
#
# Providers come from GitHub (branch 1.x) unless their checkout sits under
# OMNIPOST_PLUGINS (set it to ../.. in .env when this core sits in the
# workspace beside them): then that checkout is what runs. omnisense/contracts
# likewise: its checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts
# in .env when it sits beside the family's folder), its tests run with the
# family's; GitHub otherwise.
name: omnipost-harness

services:
  omnipost:
    build: .
    image: omnisense/omnipost-harness
    # The image may be another family's harness tagged (PHP 8.4 with Composer): the entrypoint is
    # named here, not taken from the image.
    entrypoint: ["/omnipost/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnipost/core
      - ${OMNIPOST_PLUGINS:-./plugins}:/omnipost/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

  js:
    image: node:22-alpine
    working_dir: /omnipost/core
    command: ["node", "--test", "Tests/js/share.test.cjs"]
    # Nothing to reach: no network at all.
    network_mode: none
    volumes:
      - ..:/omnipost/core:ro

volumes:
  harness:
